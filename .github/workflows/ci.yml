name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  canvas-web:
    name: canvas-web (typecheck + contract tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canvas-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate provider registry JSON
        run: node -e "JSON.parse(require('fs').readFileSync('../providers/providers.json','utf8'))"
